name: frontend-check

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check all tracked JS
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          count=0
          for f in $(git ls-files '*.js'); do
            count=$((count + 1))
            if ! node --check "$f"; then
              echo "::error file=$f::JavaScript syntax error"
              fail=1
            fi
          done
          echo "Checked $count JS file(s)."
          exit $fail
